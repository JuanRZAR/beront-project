[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beront"
version = "0.1.0"
description = "Catalogo BÉRONT, inventario y consultas por WhatsApp"
requires-python = ">=3.13"
dependencies = [
  "flask>=3.1,<4",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "flask-wtf>=1.2,<2",
  "flask-limiter>=3.12,<5",
  "pillow>=13.0,<14",
  "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "pip-audit>=2.9,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/beront"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
filterwarnings = ["error", "ignore:Using the in-memory storage:UserWarning"]

[tool.coverage.run]
branch = true
source = ["beront"]

[tool.coverage.report]
show_missing = true
fail_under = 80

