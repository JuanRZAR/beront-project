# Frontend con SSR + API (guía 02, 2.0). IMAGE, IMAGE_API, HOST_PORT y PROYECTO los pone el VPS al desplegar.
services:
  app:
    image: ${IMAGE}
    user: "10001:10001"
    env_file: /srv/apps/${PROYECTO}/.env
    ports:
      - "127.0.0.1:${HOST_PORT}:8000"
    read_only: true
    tmpfs: [/tmp]
    pids_limit: 200
    restart: unless-stopped
    stop_grace_period: 20s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s

  api:
    image: ${IMAGE_API}
    user: "10001:10001"
    env_file: /srv/apps/${PROYECTO}/.env
    read_only: true
    tmpfs: [/tmp]
    pids_limit: 200
    restart: unless-stopped
    stop_grace_period: 20s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    volumes:
      - /srv/apps/${PROYECTO}/data/var:/app/var
    networks: [default, infra]

  migrate:
    profiles: ["migrate"]
    image: ${IMAGE_API}
    user: "10001:10001"
    env_file: /srv/apps/${PROYECTO}/.env
    command: ["alembic", "upgrade", "head"]
    networks: [infra]

networks:
  infra:
    external: true
